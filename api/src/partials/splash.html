<div class="splash" id="splash" aria-hidden="true">
  <div class="pond"><i></i><i></i><i></i></div>
  <div class="stage" id="stage">
    <svg class="koi" id="koi" viewBox="0 0 1352 1352" overflow="visible" aria-hidden="true">
      <defs>
        <radialGradient id="kg" cx="38%" cy="32%" r="80%"><stop offset="0" stop-color="#2E8FD8"/><stop offset=".55" stop-color="#1873BC"/><stop offset="1" stop-color="#0F4C8F"/></radialGradient>
        <radialGradient id="shadow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1B2A3A" stop-opacity=".18"/><stop offset="1" stop-color="#1B2A3A" stop-opacity="0"/></radialGradient>
      </defs>

      <circle id="ring" cx="589" cy="763" r="1" fill="none" stroke="#E48FA8" stroke-width="3" stroke-dasharray="16 26" opacity="0"/>
      <circle id="disc" style="transform:scale(0)" cx="676" cy="630" r="592" fill="url(#kg)" transform-origin="676 630"/>

      <ellipse id="shA" cx="589" cy="763" rx="320" ry="95" fill="url(#shadow)" opacity="0"/>
      <ellipse id="shB" cx="589" cy="763" rx="320" ry="95" fill="url(#shadow)" opacity="0"/>

      <g id="fishB" opacity="0"><path id="bodyB" fill="#1873BC" fill-rule="evenodd"/></g>
      <g id="fishA" opacity="0"><path id="bodyA" fill="#ffffff" fill-rule="evenodd"/></g>

      <g id="bubbles" fill="#fff" opacity="0"><circle class="b" cx="810" cy="371" r="12"/><circle class="b" cx="810" cy="301" r="26"/><circle class="b" cx="762" cy="203" r="34"/><circle class="b" cx="815" cy="76" r="54"/></g>
      <g id="trail" fill="#fff"></g>
      <image id="png" opacity="0" href="/logo.png" width="1352" height="1352"/>
    </svg>
    <div class="t foil" id="splashT">Hanami</div>
    <span class="eyebrow center" id="splashE">Sushi bar · Ängelholm</span>
  </div>
</div>
<script>
(function(){
  document.documentElement.classList.add("js");
  var s = document.getElementById("splash"), skip = false;
  try { skip = sessionStorage.getItem("hanami-splash") || /[?&]bord=/.test(location.search) || matchMedia("(prefers-reduced-motion: reduce)").matches; sessionStorage.setItem("hanami-splash", "1"); } catch (e) {}
  if (skip) { s.remove(); document.documentElement.classList.add("no-splash"); return; }
  document.documentElement.classList.add("splashing");

  var $ = function(id) { return document.getElementById(id); };
  var clamp = function(v, a, b) { return v < a ? a : v > b ? b : v; };
  var easeOut = function(t) { return 1 - Math.pow(1 - t, 3); };
  var easeInOut = function(t) { return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; };
  var smooth = function(e0, e1, x) { var t = clamp((x - e0)/(e1 - e0), 0, 1); return t*t*(3 - 2*t); };
  var elastic = function(t) { return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -9*t)*Math.sin((t*10 - .75)*(2*Math.PI/3)) + 1; };

  /* Kroppen som punkter (nosen åt +x). Varje bildruta böjs punkterna av en våg som
     vandrar mot stjärten – hela konturen deformeras, så inga skarvar syns. */
  var PTS = [[[505.0,650.4],[471.3,632.1],[430.9,616.3],[370.6,601.9],[364.3,602.5],[356.5,600.6],[317.2,601.6],[284.8,608.2],[257.5,619.2],[235.8,632.5],[209.9,655.2],[194.8,671.1],[174.2,697.0],[173.5,699.9],[171.1,701.4],[170.4,704.3],[168.0,705.8],[167.3,708.7],[164.9,710.2],[160.9,718.5],[155.1,725.4],[120.2,790.0],[99.1,835.4],[93.2,851.5],[86.1,864.2],[84.5,871.0],[77.4,883.7],[76.0,889.5],[73.3,892.0],[64.8,910.5],[52.4,928.1],[38.0,945.2],[18.3,963.2],[-7.9,978.5],[-39.3,989.5],[-18.4,992.4],[-14.1,991.4],[-8.3,992.8],[8.2,992.6],[11.6,991.4],[15.5,992.3],[66.3,981.8],[93.6,970.8],[108.1,961.9],[124.9,947.4],[135.7,940.7],[143.5,938.5],[154.4,940.0],[167.6,949.4],[180.4,968.9],[200.1,990.0],[234.6,1017.7],[265.4,1039.5],[285.0,1056.5],[296.3,1069.4],[301.5,1077.9],[304.8,1089.9],[306.9,1089.4],[309.6,1065.4],[305.2,1040.7],[282.4,998.3],[253.7,950.3],[242.2,920.9],[237.1,899.1],[234.3,863.5],[236.6,828.0],[239.6,815.4],[239.7,806.2],[249.2,766.3],[252.8,759.9],[254.6,752.2],[269.1,725.8],[288.0,702.5],[311.3,682.4],[331.8,669.8],[349.2,661.6],[376.0,652.6],[393.4,648.5],[426.4,644.0],[472.5,644.7]],[[940.0,723.1],[944.4,704.6],[943.6,699.3],[945.2,692.5],[944.5,669.7],[940.1,645.0],[931.1,618.2],[922.9,600.8],[898.2,562.0],[868.2,528.2],[825.3,492.3],[766.2,455.6],[761.4,454.4],[751.6,448.0],[718.2,432.8],[737.1,452.8],[766.1,490.5],[785.4,521.8],[808.5,571.5],[827.4,591.5],[868.6,630.0],[889.0,652.4],[912.6,682.7],[927.4,706.8],[932.7,723.4],[935.0,727.0]],[[873.0,1082.4],[881.8,1071.1],[899.0,1042.3],[922.9,989.4],[925.6,977.7],[930.1,967.5],[940.6,923.7],[945.0,883.6],[942.3,882.0],[934.8,883.3],[930.9,882.3],[904.7,888.4],[861.7,918.3],[848.6,921.3],[838.4,921.0],[827.7,918.4],[819.4,914.4],[794.1,908.4],[786.9,908.7],[774.8,912.0],[769.9,910.8],[766.9,906.0],[770.9,889.5],[775.4,883.3],[781.4,879.6],[808.1,879.8],[827.5,876.2],[843.2,870.7],[863.2,860.0],[883.9,842.3],[913.5,808.3],[936.6,789.1],[937.3,786.2],[930.7,762.0],[922.0,738.3],[910.3,714.0],[884.6,675.0],[868.7,655.8],[844.6,631.5],[800.8,595.4],[778.8,579.9],[775.9,579.2],[774.4,576.8],[751.9,563.2],[748.0,562.3],[745.6,559.6],[726.1,550.9],[722.6,548.0],[716.8,546.6],[701.2,538.8],[693.4,536.9],[688.0,533.6],[667.1,526.6],[627.2,517.1],[616.4,527.9],[596.2,561.1],[581.8,578.2],[572.0,585.1],[559.4,590.3],[548.7,591.9],[536.1,588.9],[535.1,584.6],[569.5,539.3],[577.3,523.7],[578.9,508.6],[563.1,505.9],[538.8,504.2],[534.4,505.2],[528.6,503.9],[504.8,504.4],[501.5,505.6],[497.6,504.7],[463.7,509.0],[441.9,514.0],[420.6,521.3],[395.3,532.8],[361.6,553.5],[332.9,574.5],[352.6,574.0],[386.6,578.0],[428.4,587.9],[436.7,592.0],[448.4,594.7],[481.0,608.7],[502.0,619.9],[526.2,634.9],[549.7,652.8],[552.6,653.5],[558.4,650.7],[569.0,649.2],[607.4,652.1],[647.3,644.2],[673.5,646.3],[684.8,651.0],[702.4,663.4],[727.7,677.7],[755.0,688.3],[755.3,691.5],[738.4,701.8],[725.6,703.9],[706.9,700.5],[695.9,694.8],[681.3,691.3],[664.4,693.5],[651.6,699.7],[639.7,702.0],[605.7,693.9],[593.5,693.0],[622.1,728.6],[643.6,763.5],[656.7,790.3],[676.0,847.3],[686.7,893.1],[693.5,933.7],[701.1,962.3],[710.8,986.2],[724.2,1007.9],[741.9,1028.5],[764.7,1049.4],[786.7,1064.9],[828.2,1089.2],[844.5,1094.1],[855.9,1093.7],[867.7,1087.3]]];
  var X0 = -42, X1 = 948, LEN = X1 - X0;   /* marginal så att inga punkter hamnar utanför 0–1 */
  var FC = [589, 763];
  var bodyA = $("bodyA"), bodyB = $("bodyB");

  function swimPath(phase, gain) {
    var d = "", i, j, sub, p, u, amp, dy, dx;
    for (i = 0; i < PTS.length; i++) {
      sub = PTS[i]; d += "M";
      for (j = 0; j < sub.length; j++) {
        p = sub[j];
        u = clamp((p[0] - X0) / LEN, 0, 1);         /* 0 = nos, 1 = stjärt (aldrig utanför – annars NaN) */
        amp = 78 * Math.pow(u, 1.85) * gain;        /* utslaget växer mot stjärten */
        dy = amp * Math.sin(phase - u * 4.1);       /* vågen vandrar bakåt */
        dx = -amp * .10 * Math.cos(phase - u * 4.1);/* kroppen kortas något i svängen */
        d += (p[0] + dx).toFixed(1) + " " + (p[1] + dy).toFixed(1) + (j < sub.length - 1 ? " " : "Z");
      }
    }
    return d;
  }

  var R = 265, ORBIT_SCALE = .5;
  var T = { swim: 3500, settle: 700, pop: 3150, fade: 420, hold: 620 };
  var disc = $("disc"), ring = $("ring"), png = $("png"), trail = $("trail"), koi = $("koi"),
      bubbles = $("bubbles"), fishA = $("fishA"), fishB = $("fishB"), shA = $("shA"), shB = $("shB");

  function place(el, pos, ang, scale) {
    el.setAttribute("transform",
      "translate(" + (pos[0] - FC[0]).toFixed(1) + " " + (pos[1] - FC[1]).toFixed(1) + ") " +
      "translate(" + FC[0] + " " + FC[1] + ") rotate(" + (ang * 180 / Math.PI).toFixed(2) + ") " +
      "scale(" + scale.toFixed(3) + ") translate(" + (-FC[0]) + " " + (-FC[1]) + ")");
  }

  var START = [[-1250, 1750], [2350, -300]];
  var t0 = null, prev = 0, spin = 0, beat = 0, lastTrail = 0, done = false, frontIsA = true;

  function frame(now) {
    if (done || !document.body.contains(s)) return;      // säkerhetsnätet kan ha stängt skärmen
    if (!t0) { t0 = now; prev = now; }
    var t = now - t0, dt = Math.min(now - prev, 50) / 1000; prev = now;

    var p      = clamp(t / T.swim, 0, 1);
    var settle = easeInOut(clamp((t - T.swim) / T.settle, 0, 1));
    var merge  = easeInOut(clamp((t - (T.swim - 950)) / 950, 0, 1));
    var pIn    = easeOut(clamp(t / 900, 0, 1));

    /* mjuk fartkurva: accelererar in, håller farten, bromsar mot slutet */
    var speed = 2.05 * smooth(0, .2, p) * (1 - .6 * smooth(.7, 1, p));
    spin += speed * dt;
    beat += dt * (6.6 - 3.2 * settle);                 /* stjärtslag per sekund */

    var gain = (1 - settle) * (.6 + .4 * (1 - merge));
    bodyA.setAttribute("d", swimPath(beat, gain));
    bodyB.setAttribute("d", swimPath(beat + 1.7, gain));

    var rad = R * (1 - merge);
    var posOf = function(ph) {
      var a = spin + ph;
      return { pos: [FC[0] + Math.cos(a)*rad, FC[1] + Math.sin(a)*rad*.88], ang: a + Math.PI/2, depth: Math.sin(a) };
    };
    var A = posOf(Math.PI/2), B = posOf(-Math.PI/2);
    var lerp = function(st, to) { return [st[0] + (to[0]-st[0])*pIn, st[1] + (to[1]-st[1])*pIn]; };
    var posA = lerp(START[0], A.pos), posB = lerp(START[1], B.pos);
    var dScale = function(d) { return 1 + .1*d*(1 - merge); };
    var scale = ORBIT_SCALE + (1 - ORBIT_SCALE)*settle;

    fishA.setAttribute("opacity", Math.min(1, pIn*1.4).toFixed(3));
    place(fishA, [posA[0] + (FC[0]-posA[0])*settle, posA[1] + (FC[1]-posA[1])*settle], A.ang*(1-settle), scale*dScale(A.depth));

    var fadeB = clamp((t - (T.swim - 600)) / 600, 0, 1);
    fishB.setAttribute("opacity", (pIn*(1-fadeB)).toFixed(3));
    place(fishB, posB, B.ang, ORBIT_SCALE*dScale(B.depth)*(1 - fadeB*.25));

    if ((A.depth > B.depth) !== frontIsA) {
      frontIsA = A.depth > B.depth;
      fishA.parentNode.insertBefore(frontIsA ? fishB : fishA, frontIsA ? fishA : fishB);
    }

    var shadow = function(el, pos, d, vis) {
      el.setAttribute("opacity", (vis*(.3 + .25*d)).toFixed(3));
      el.setAttribute("transform", "translate(" + (pos[0]-FC[0]).toFixed(1) + " " + (pos[1]-FC[1]+130).toFixed(1) + ") scale(" + (scale*.9).toFixed(3) + ")");
    };
    shadow(shA, posA, A.depth, pIn*(1-settle));
    shadow(shB, posB, B.depth, pIn*(1-fadeB));

    ring.setAttribute("r", Math.max(1, rad));
    ring.setAttribute("opacity", (pIn*.3*(1-merge)).toFixed(3));
    ring.setAttribute("transform", "rotate(" + (spin*22).toFixed(1) + " " + FC[0] + " " + FC[1] + ")");

    if (t - lastTrail > 110 && settle < 1) {
      lastTrail = t;
      [[posA, A.ang, 1, A.depth], [posB, B.ang, 1 - fadeB, B.depth]].forEach(function(f) {
        if (f[2] <= .05) return;
        var c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", f[0][0] - Math.cos(f[1])*210 + (Math.random()*50 - 25));
        c.setAttribute("cy", f[0][1] - Math.sin(f[1])*210);
        c.setAttribute("r", (4 + Math.random()*8)*(1 + .15*f[3]));
        c.dataset.born = t; c.dataset.max = f[2]*.75; trail.appendChild(c);
      });
    }
    Array.prototype.forEach.call(trail.children, function(c) {
      var age = t - c.dataset.born, life = 900;
      if (age > life) { c.remove(); return; }
      c.setAttribute("cy", +c.getAttribute("cy") - 1.1);
      c.setAttribute("opacity", ((1 - age/life)*c.dataset.max).toFixed(3));
    });

    disc.style.transform = "scale(" + elastic(clamp((t - T.pop)/760, 0, 1)) + ")";
    bubbles.setAttribute("opacity", clamp((t - (T.swim + 180))/420, 0, 1));
    var fp = clamp((t - (T.swim + T.settle))/T.fade, 0, 1);
    png.setAttribute("opacity", fp);
    if (fp > 0 && $("splashT")) { $("splashT").classList.add("in"); $("splashE").classList.add("in"); }

    if (t < T.swim + T.settle + T.fade + T.hold) requestAnimationFrame(frame); else handoff();
  }

  function handoff() {
    if (done) return; done = true;
    var target = document.querySelector(".moon img") || document.querySelector(".brand img");
    $("stage").querySelectorAll(".t,.eyebrow").forEach(function(e) { e.classList.add("out"); });
    if (target) {
      var a = koi.getBoundingClientRect(), b = target.getBoundingClientRect();
      koi.style.transformOrigin = "0 0";
      koi.style.transform = "translate(" + (b.left - a.left) + "px," + (b.top - a.top) + "px) scale(" + (b.width/a.width) + ")";
      document.documentElement.classList.add("logo-arriving");
    }
    s.classList.add("gone");
    setTimeout(function() { document.documentElement.classList.remove("splashing"); document.dispatchEvent(new Event("splash:done")); }, 380);
    setTimeout(function() { document.documentElement.classList.remove("logo-arriving"); }, 720);
    setTimeout(function() { s.remove(); }, 1000);
  }

  requestAnimationFrame(frame);
  setTimeout(handoff, 9500);
})();
</script>
