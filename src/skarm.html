<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beställningar – Hanami Sushi Bar</title>
<link rel="icon" href="/favicon.png">
<style>
/* Kundskärm för TV i butiken (öppnas i TV:ns webbläsare: hanamisushibar.se/skarm).
   Bara ordernummer – inga namn eller belopp. Byggd för gamla TV-webbläsare (Samsung): inga CSS-variabler, ingen flexbox,
   inga HTML5-taggar. 1rem = 1 % av skärmens höjd (sätts i skriptet), allt annat är absolut positionerat. */
*{-webkit-box-sizing:border-box;box-sizing:border-box;margin:0;padding:0}
html{font-size:10.8px}
html,body{height:100%;background:#0B2240;color:#F6F1E7;font-family:"Helvetica Neue",Arial,sans-serif;overflow:hidden;cursor:none}
.top,.cols,.foot{position:absolute;left:0;right:0}
.top{top:0;height:12rem;padding:0 5rem;border-bottom:2px solid #5B5A4E}
.brand{float:left;height:12rem;padding-top:2rem}
.brand img{float:left;height:8rem;width:8rem;margin-right:2.5rem}
.brand div{float:left;padding-top:.6rem}
.brand b{display:block;font:italic 400 5rem/1 Georgia,"Times New Roman",serif;color:#D4B26A}
.brand span{display:block;font-size:1.8rem;letter-spacing:.5em;color:#9FB1C8;margin-top:.6rem}
.clock{float:right;font-size:6rem;line-height:12rem;font-weight:300;letter-spacing:.05em}
.cols{top:12rem;height:68rem}
.col{position:absolute;top:0;bottom:0;width:50%;padding:2.5rem 4.4rem;overflow:hidden}
.cook{left:0}
.ready{left:50%;border-left:2px solid #1C3553}
.col h2{font-size:4.6rem;line-height:6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2.5rem;white-space:nowrap}
.col h2 i{display:inline-block;vertical-align:middle;width:2.6rem;height:2.6rem;border-radius:50%;margin:-.6rem 2rem 0 0}
.cook h2{color:#F2B441} .cook h2 i{background:#F2B441}
.ready h2{color:#3FCB7E} .ready h2 i{background:#3FCB7E}
.list{margin:0 -1.4rem}
.no{display:inline-block;vertical-align:top;margin:0 1.4rem 2rem;background:#10305A;border-radius:1.2rem;padding:1.2rem 2.8rem;font-weight:800;font-size:8rem;line-height:1.05;letter-spacing:.02em;text-align:center;min-width:22%}
.no small{display:block;font-size:.3em;font-weight:400;color:#9FB1C8;letter-spacing:.06em;margin-top:.3rem}
.ready .no{background:#0F4A35;color:#fff;border:.35rem solid #3FCB7E}
.ready .no.new{-webkit-animation:pop 1.2s ease-in-out infinite alternate;animation:pop 1.2s ease-in-out infinite alternate}
@-webkit-keyframes pop{from{-webkit-transform:scale(1)}to{-webkit-transform:scale(1.06);box-shadow:0 0 4rem 1rem rgba(63,203,126,.55)}}
@keyframes pop{from{transform:scale(1)}to{transform:scale(1.06);box-shadow:0 0 4rem 1rem rgba(63,203,126,.55)}}
.empty{font-size:3rem;color:#9FB1C8;margin:1rem 1.4rem 0}
.more{display:inline-block;font-size:3rem;color:#9FB1C8;margin:3rem 1.4rem 0}
.foot{bottom:0;height:20rem;padding:0 5rem;background:#081A31;font-size:3rem;color:#9FB1C8}
.foot b{color:#F6F1E7}
.foot .info{float:left;line-height:20rem}
.foot .order{float:right;height:20rem;padding-top:1.5rem}
.foot .order .txt{float:left;text-align:right;padding-top:4.5rem;line-height:1.35}
.foot .qr{float:left;margin-left:3.5rem;height:17rem;width:17rem;background:#fff;padding:1rem;border-radius:1rem;line-height:0}
.foot .qr svg{width:100%;height:100%}
.off{position:fixed;right:2rem;bottom:21rem;font-size:2rem;color:#ffb4a8;display:none}
.off.show{display:block}
.sound{position:fixed;left:0;right:0;bottom:21rem;text-align:center;font-size:2rem;color:#9FB1C8}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><img src="/logo.png" alt=""><div><b>Hanami</b><span>SUSHI BAR</span></div></div>
  <div class="clock" id="clock"></div>
</div>
<div class="cols">
  <div class="col cook"><h2><i></i>Tillagas</h2><div class="list" id="cook"></div></div>
  <div class="col ready"><h2><i></i>Klar att hämta</h2><div class="list" id="ready"></div></div>
</div>
<div class="foot">
  <span class="info">Ditt ordernummer står på kvittot och i bekräftelsen.</span>
  <span class="order"><span class="txt">Skanna och beställ i mobilen<br><b>hanamisushibar.se/meny</b></span><span class="qr" id="qr"></span></span>
</div>
<div class="off" id="off">Ingen anslutning – försöker igen …</div>
<div class="sound" id="sound">Tryck på skärmen (eller OK på fjärrkontrollen) för ljud när en beställning är klar</div>
<script src="/qr.js"></script>
<script>
(function () {
  var NAME = "/*NAME*/";
  var q = location.search, withTables = /[?&]bord=1/.test(q);
  var known = null, fresh = {}, audio = null;
  function $(id) { return document.getElementById(id); }
  // 1rem = 1 % av höjden – fungerar även där vh/vw saknas
  function scale() { document.documentElement.style.fontSize = (window.innerHeight || document.documentElement.clientHeight) / 100 + "px"; }
  scale(); window.addEventListener("resize", scale);
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function tick() { var d = new Date(); $("clock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  tick(); setInterval(tick, 10000);
  try { if (window.qrSvg) $("qr").innerHTML = qrSvg("https://hanamisushibar.se/meny", 120); } catch (e) {}

  // Ljud (pling) när en ny beställning blir klar – webbläsaren kräver en knapptryckning först
  function enableSound() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); $("sound").style.display = "none"; } catch (e) {}
  }
  document.addEventListener("keydown", enableSound); document.addEventListener("click", enableSound);
  function chime() {
    if (!audio) return;
    [880, 1318.5].forEach(function (f, i) {
      var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.22;
      o.frequency.value = f; o.type = "sine"; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      o.start(t); o.stop(t + 1);
    });
  }

  function size(n) { return n <= 4 ? "11rem" : n <= 8 ? "8.5rem" : n <= 15 ? "6.2rem" : "4.8rem"; }
  function render(el, list, ready) {
    var max = 24, shown = list.slice(0, max);
    var fs = size(shown.length);
    el.innerHTML = shown.length ? shown.map(function (o) {
      var sub = o.table ? "Bord " + o.table : (!ready && o.time ? "kl " + o.time.replace(":", ".") : "");
      return '<div class="no' + (ready && fresh[o.no] ? " new" : "") + '" style="font-size:' + fs + '">' + esc(o.no) + (sub ? "<small>" + esc(sub) + "</small>" : "") + "</div>";
    }).join("") + (list.length > max ? '<span class="more">+' + (list.length - max) + "</span>" : "")
      : '<p class="empty">' + (ready ? "Inga beställningar att hämta just nu" : "Inga beställningar i kön") + "</p>";
  }

  // XMLHttpRequest i stället för fetch: Samsung-TV:ar från 2016 (Tizen 2.4) saknar fetch och Promise-stöd i webbläsaren.
  // t= byts var 10:e sekund så att TV:ns cache inte visar gamla data (Vercels CDN delar ändå svaret mellan skärmar).
  function load() {
    var x = new XMLHttpRequest();
    x.open("GET", "/api/board?t=" + Math.floor(new Date().getTime() / 10000) + (withTables ? "&bord=1" : ""), true);
    x.timeout = 15000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var d = null;
      try { d = JSON.parse(x.responseText); } catch (e) {}
      if (x.status !== 200 || !d || !d.ok) { $("off").className = "off show"; return; }
      try { show(d); $("off").className = "off"; } catch (e) { $("off").textContent = "Fel: " + e.message; $("off").className = "off show"; }
    };
    x.send();
  }
  function show(d) {
    var now = new Date().getTime(), nowReady = {}, ding = false, k;
    for (var i = 0; i < d.ready.length; i++) {
      var o = d.ready[i];
      nowReady[o.no] = 1;
      if (known && !known[o.no] && !fresh[o.no]) { fresh[o.no] = now; ding = true; }
    }
    for (k in fresh) if (!nowReady[k] || now - fresh[k] > 90000) delete fresh[k];   // blinkar i 1,5 min
    known = nowReady;
    render($("cook"), d.cooking, false);
    render($("ready"), d.ready, true);
    if (ding) chime();
  }
  window.onerror = function (msg) { $("off").textContent = "Fel: " + msg; $("off").className = "off show"; };
  load(); setInterval(load, 10000);

  // Håll skärmen vaken där det går, och ladda om sidan varje natt (nya versioner, minnesläckor)
  try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {}); } catch (e) {}
  setTimeout(function () { location.reload(); }, (function () { var d = new Date(), t = new Date(d); t.setHours(24, 5, 0, 0); return t - d; })());
  document.title = "Beställningar – " + NAME;
})();
</script>
</body>
</html>
