<div class="splash" id="splash" aria-hidden="true">
  <div class="pond"><i></i><i></i><i></i></div>
  <div class="stage" id="stage">
    <svg class="koi" id="koi" viewBox="0 0 1352 1352" overflow="visible" aria-hidden="true">
      <defs>
        <radialGradient id="kg" cx="38%" cy="32%" r="80%"><stop offset="0" stop-color="#2E8FD8"/><stop offset=".55" stop-color="#1873BC"/><stop offset="1" stop-color="#0F4C8F"/></radialGradient>
        <filter id="wob" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.006 0.004" numOctaves="1" seed="7" result="n">
            <animate attributeName="baseFrequency" values="0.006 0.004;0.009 0.005;0.006 0.004" dur="1.1s" repeatCount="indefinite"/>

      <g id="bubbles" fill="#fff"><circle class="b" cx="810" cy="371" r="12" style="--i:0"/><circle class="b" cx="810" cy="301" r="26" style="--i:1"/><circle class="b" cx="762" cy="203" r="34" style="--i:2"/><circle class="b" cx="815" cy="76" r="54" style="--i:3"/></g>
      <g id="trail" fill="#fff" opacity=".9"></g>
      <image id="png" href="/logo.png" width="1352" height="1352" opacity="0"/>
    </svg>
    <div class="t foil" id="splashT">Hanami</div>
    <span class="eyebrow center" id="splashE">Sushi bar · Ängelholm</span>
  </div>
</div>
<script>
(function(){
  document.documentElement.classList.add("js");
  var s = document.getElementById("splash"), skip = false;
  try { skip = sessionStorage.getItem("hanami-splash") || /[?&]bord=/.test(location.search) || matchMedia("(prefers-reduced-motion: reduce)").matches; sessionStorage.setItem("hanami-splash", "1"); } catch (e) {}
  if (skip) { s.remove(); document.documentElement.classList.add("no-splash"); return; }
  document.documentElement.classList.add("splashing");

  /* ---------- hjälp ---------- */
  var $ = function(id){ return document.getElementById(id); };
  var clamp = function(v,a,b){ return v<a?a:v>b?b:v; };
  var easeOut = function(t){ return 1-Math.pow(1-t,3); };
  var easeInOut = function(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; };
  var elastic = function(t){ return t===0?0:t===1?1:Math.pow(2,-9*t)*Math.sin((t*10-.75)*(2*Math.PI/3))+1; };

  /* Simbana i logotypens koordinater – slutar exakt i logotypens fiskposition, sista biten upp åt vänster som fisken pekar */
  var FC = [589,763];
  var P = [[-1700,-100],[-1000,250],[-350,950],[450,1500],[1250,1450],[1400,1000],[1050,1120],FC];
  function spline(t){                                  /* Catmull-Rom över P, t 0..1 -> [x,y,tangent] */
    var n = P.length-1, f = t*n, i = clamp(Math.floor(f),0,n-1), u = f-i;
    var p0 = P[Math.max(i-1,0)], p1 = P[i], p2 = P[i+1], p3 = P[Math.min(i+2,n)];
    var c = function(a,b,d,e){ return .5*((2*b)+(-a+d)*u+(2*a-5*b+4*d-e)*u*u+(-a+3*b-3*d+e)*u*u*u); };
    var dc = function(a,b,d,e){ return .5*((-a+d)+2*(2*a-5*b+4*d-e)*u+3*(-a+3*b-3*d+e)*u*u); };
    return [c(p0[0],p1[0],p2[0],p3[0]), c(p0[1],p1[1],p2[1],p3[1]), Math.atan2(dc(p0[1],p1[1],p2[1],p3[1]), dc(p0[0],p1[0],p2[0],p3[0]))];
  }
  var HEAD = Math.atan2(-1050,-250);                    /* fiskens egen riktning i logotypen (stjärt -> huvud) */

  var fishG = $("fishG"), wob = $("wobMap"), disc = $("disc"), png = $("png"), trail = $("trail"), koi = $("koi");
  var bubbles = Array.prototype.slice.call(document.querySelectorAll("#bubbles .b"));
  bubbles.forEach(function(b){ b.style.opacity = 0; });
  disc.style.transform = "scale(0)";
  var T = { swim: 2600, settle: 560, pop: 2000, fade: 380, hold: 560 };
  var t0 = null, lastTrail = 0, done = false;

  function frame(now){
    if (!t0) t0 = now;
    var t = now - t0;
    /* 1. fisken simmar */
    var ps = clamp(t / T.swim, 0, 1), pe = easeInOut(ps);
    var s = spline(pe), rot = s[2] - HEAD;
    var settle = clamp((t - T.swim) / T.settle, 0, 1);   /* 2. glider på plats: rotation -> 0, vaggning -> 0 */
    rot = rot * (1 - easeOut(settle));
    var wag = Math.sin(t / 95) * 6 * (1 - settle);
    var scale = .62 + .38 * easeOut(clamp(t / (T.swim + T.settle), 0, 1));
    fishG.setAttribute("transform", "translate(" + (s[0]-FC[0]) + " " + (s[1]-FC[1]) + ") rotate(" + ((rot*180/Math.PI)+wag) + " " + FC[0] + " " + FC[1] + ") scale(" + scale + ")");
    fishG.style.transformOrigin = FC[0] + "px " + FC[1] + "px";
    wob.setAttribute("scale", 46 * (1 - settle));
    /* bubblor efter huvudet */
    if (t - lastTrail > 140 && settle < 1) {
      lastTrail = t;
      var c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", s[0] + Math.cos(s[2]) * 380 + (Math.random()*60-30)); c.setAttribute("cy", s[1] + Math.sin(s[2]) * 380);
      c.setAttribute("r", 8 + Math.random() * 14); c.dataset.born = t; trail.appendChild(c);
    }
    Array.prototype.forEach.call(trail.children, function(c){
      var age = t - c.dataset.born, life = 900;
      if (age > life) { c.remove(); return; }
      c.setAttribute("cy", c.getAttribute("cy") - 1.4); c.setAttribute("opacity", 1 - age / life);
    });
    /* 3. skivan poppar upp bakom fisken */
    var pp = clamp((t - T.pop) / 700, 0, 1);
    disc.style.transform = "scale(" + elastic(pp) + ")";
    /* 4. logotypens bubblor stiger */
    bubbles.forEach(function(b, i){
      var q = clamp((t - (T.swim + 150 + i * 110)) / 380, 0, 1);
      b.style.opacity = q; b.setAttribute("transform", "translate(0 " + (40 * (1 - easeOut(q))) + ")");
    });
    /* 5. tona in originallogotypen */
    var fp = clamp((t - (T.swim + T.settle)) / T.fade, 0, 1);
    png.setAttribute("opacity", fp);
    if (fp > 0) { $("splashT").classList.add("in"); $("splashE").classList.add("in"); }
    if (t < T.swim + T.settle + T.fade + T.hold) requestAnimationFrame(frame); else handoff();
  }

  /* 6. logotypen glider över till sin plats i sidhuvudet/hero ("FLIP") */
  function handoff(){
    if (done) return; done = true;
    var target = document.querySelector(".moon img") || document.querySelector(".brand img");
    var stage = $("stage");
    stage.querySelectorAll(".t,.eyebrow").forEach(function(e){ e.classList.add("out"); });
    if (target) {
      var a = koi.getBoundingClientRect(), b = target.getBoundingClientRect();
      var k = b.width / a.width;
      koi.style.transformOrigin = "0 0";
      koi.style.transform = "translate(" + (b.left - a.left) + "px," + (b.top - a.top) + "px) scale(" + k + ")";
      document.documentElement.classList.add("logo-arriving");
    }
    s.classList.add("gone");
    setTimeout(function(){ document.documentElement.classList.remove("splashing"); document.dispatchEvent(new Event("splash:done")); }, 380);
    setTimeout(function(){ document.documentElement.classList.remove("logo-arriving"); }, 720);
    setTimeout(function(){ s.remove(); }, 1000);
  }
  window.addEventListener("load", function(){ requestAnimationFrame(frame); });
  setTimeout(function(){ if (!t0) requestAnimationFrame(frame); }, 1200);   /* starta även om något på sidan laddar långsamt */
  setTimeout(handoff, 7000);                                                   /* säkerhetsnät */
})();
</script>
