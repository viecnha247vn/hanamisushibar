<button class="fab" id="fab" type="button" aria-haspopup="dialog" data-pick-open>
  <svg aria-hidden="true"><use href="#i-bag"/></svg>Boka &amp; Beställ
</button>

<dialog class="pick" id="pick" aria-labelledby="pickTitle">
  <button class="x" type="button" data-pick-close aria-label="Stäng"><svg width="14" height="14"><use href="#i-x"/></svg></button>
  <div class="ph">
    <span class="eyebrow">Hanami Sushi Bar</span>
    <h2 id="pickTitle" class="pick-title">Vad vill du göra?</h2>
  </div>
  <div class="opts">
    <a class="opt" href="/meny" data-pick="order">
      <span class="ic"><svg><use href="#i-bag"/></svg></span>
      <span><b>Beställ take away</b><span><strong>Välj rätter och hämtningstid</strong> – vi sms:ar när maten är klar.</span></span>
      <i><svg width="18" height="18"><use href="#i-arrow"/></svg></i>
    </a>
    <a class="opt" href="/#boka" data-pick="book">
      <span class="ic"><svg><use href="#i-cal"/></svg></span>
      <span><b>Boka bord</b><span>Upp till <strong>{{MAXG}} personer</strong> online. Vi bekräftar med sms.</span></span>
      <i><svg width="18" height="18"><use href="#i-arrow"/></svg></i>
    </a>
    <div class="opt info">
      <span class="ic"><svg><use href="#i-table"/></svg></span>
      <span><b>Beställ vid bordet</b><span>Sitter du hos oss? <strong>Skanna QR‑koden</strong> på bordet – beställningen går <strong>direkt till köket</strong>.</span></span>
    </div>
    <a class="btn ghost block" href="tel:{{TEL}}" style="margin-top:.4rem"><svg width="16" height="16" aria-hidden="true"><use href="#i-phone"/></svg>Ring {{PHONE}}</a>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
